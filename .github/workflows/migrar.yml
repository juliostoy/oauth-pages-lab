name: migrar-d1

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - ".github/workflows/migrar.yml"
      - "wrangler.toml"

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala dependências
        run: npm ci

      - name: Aplica migrações no Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply oauth-atividade-julio --remote
