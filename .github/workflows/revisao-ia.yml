name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt com o diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens:"
            echo "- Segredos expostos."
            echo "- SQL montado por concatenação em vez de prepare().bind()."
            echo "- Erros de lógica."
            echo ""
            echo '```diff'
            git diff "origin/${BASE_REF}...HEAD" | head -c 20000
            echo ""
            echo '```'
          } > prompt.txt

      - name: Revisa o código com IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          COPILOT_MODEL: auto
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo. Analise apenas o diff fornecido e não invente problemas.

      - name: Comenta no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file "${{ steps.ia.outputs.response-file }}"
