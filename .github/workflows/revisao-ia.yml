name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt com o diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > diff.txt
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Responda em português, com no máximo 10 itens."
            echo "Procure segredos expostos, SQL sem prepare().bind() e erros de lógica."
            echo "Se não encontrar problemas, diga isso claramente."
            echo ""
            cat diff.txt | head -c 20000
          } > prompt.txt

      - name: Revisa o código com IA
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "$(cat prompt.txt)" -s --no-ask-user --excluded-tools='shell,write,url,github-mcp-server' > resposta.txt

      - name: Comenta no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file resposta.txt
